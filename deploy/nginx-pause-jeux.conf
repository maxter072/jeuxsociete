# Reverse proxy Nginx pour « Pause Jeux »
# Installation :
#   cp deploy/nginx-pause-jeux.conf /etc/nginx/sites-available/pause-jeux.conf
#   ln -s /etc/nginx/sites-available/pause-jeux.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Adapter server_name, et décommenter le bloc TLS si certificat disponible.

server {
    listen 80;
    listen [::]:80;
    server_name jeux.mondomaine.fr;   # <-- à adapter

    # Optionnel : accès restreint par mot de passe
    # auth_basic "Pause Jeux";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    access_log /var/log/nginx/pause-jeux.access.log;
    error_log  /var/log/nginx/pause-jeux.error.log;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

